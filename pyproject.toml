[project]
name = "vertice-dbt"
version = "0.1.0"
description = "ELT da Vértice Distribuidora com dbt + DuckDB: staging, regras de negócio, testes e documentação."
requires-python = ">=3.12"
dependencies = [
    "dbt-core~=1.12",
    "dbt-duckdb~=1.11",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 120
