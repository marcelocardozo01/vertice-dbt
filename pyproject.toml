[project]
name = "vertice-dbt"
version = "0.1.0"
description = "ELT da Vértice Distribuidora com dbt + DuckDB: staging, regras de negócio, testes e documentação."
requires-python = ">=3.12"
dependencies = [
    "dbt-core~=1.12",
    "dbt-duckdb~=1.11",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "dagster>=1.13.29",
    "dagster-dbt>=0.29.29",
]

[dependency-groups]
dev = [
    "dagster-webserver>=1.13.29",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vertice_dagster"]

# `dagster dev` encontra as definições por aqui, sem precisar de workspace.yaml.
[tool.dagster]
module_name = "vertice_dagster.definitions"
code_location_name = "vertice_dbt"

[tool.ruff]
line-length = 120
