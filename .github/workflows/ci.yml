name: dbt CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --dev

      - name: Lint do Python
        run: uv run ruff check scripts

      - name: Extração (planilhas -> Parquet)
        run: uv run python scripts/extract.py

      - name: dbt deps
        run: uv run dbt deps

      - name: dbt build (seeds + modelos + testes)
        run: uv run dbt build --target ci

      - name: dbt docs
        run: uv run dbt docs generate --target ci

      - name: Publicar artefatos da documentação
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/index.html
            target/catalog.json
            target/manifest.json
